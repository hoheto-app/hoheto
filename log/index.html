<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はにほ日誌 — Hoheto</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="mascot.png">
<meta name="theme-color" content="#f5f0e4">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700;900&family=Inconsolata:wght@300;400&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f5f0e4;
  color: #1a1510;
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  padding: 60px 20px 80px;
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 27px,
    rgba(180,160,120,0.12) 28px
  );
}

.wrap {
  max-width: 640px;
  margin: 0 auto;
}

header.page-head {
  text-align: center;
  margin-bottom: 48px;
}

.mascot-small {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  opacity: 0.92;
}
.mascot-small img { width: 100%; height: auto; }

h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-bottom: 10px;
}

.lead {
  font-size: 0.88rem;
  color: #6a5a40;
  line-height: 2;
  letter-spacing: 0.03em;
}

.rule {
  height: 1px;
  background: #cec6b5;
  margin: 40px auto;
  width: 100px;
}

.entry {
  padding: 22px 0;
  border-bottom: 1px solid #ddd6c0;
}
.entry:last-child { border-bottom: none; }

.entry-date {
  font-family: 'Inconsolata', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  color: #9a8a70;
  margin-bottom: 8px;
}

.entry-body {
  font-size: 0.95rem;
  line-height: 2;
  color: #3a3020;
}

.entry-tag {
  display: inline-block;
  font-family: 'Inconsolata', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  color: #c4a060;
  border: 0.5px solid #c4a060;
  padding: 1px 8px;
  margin-bottom: 10px;
}

footer {
  text-align: center;
  margin-top: 60px;
  font-family: 'Inconsolata', monospace;
  font-size: 0.65rem;
  color: #cec6b5;
  letter-spacing: 0.15em;
}
footer a { color: #9a8a70; text-decoration: none; }
</style>
</head>
<body>

<div class="wrap">
  <header class="page-head">
    <div class="mascot-small"><img src="mascot.png" alt="はにほ"></div>
    <h1>はにほ日誌</h1>
    <p class="lead">
      はにほは、時どき忘れっぽかったり、道に迷ったりします。<br>
      直したことを、ここにそっと書き残しておきます。
    </p>
  </header>

  <div class="rule"></div>

  <div class="entries">

    <div class="entry">
      <div class="entry-tag">なおしました</div>
      <div class="entry-date">2026.07.29</div>
      <div class="entry-body">
        はにほが橋のかけ方を少し間違えていました。もう大丈夫です。
      </div>
    </div>

    <div class="entry">
      <div class="entry-tag">なおしました</div>
      <div class="entry-date">2026.07.29</div>
      <div class="entry-body">
        入り口の扉が、まだ「準備中」の札を下げたままでした。今はちゃんと開いています。
      </div>
    </div>

  </div>

  <footer>
    <a href="/">HOHETO</a> &nbsp;·&nbsp; hohe.to
  </footer>
</div>

</body>
</html>
